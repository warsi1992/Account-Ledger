<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650">
  <rect width="1100" height="650" fill="white"/>
  <text x="550" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold">In-Memory Account Ledger Architecture</text>
  <g font-family="Arial" font-size="18" text-anchor="middle">
    <rect x="380" y="80" width="340" height="70" rx="12" fill="#f2f2f2" stroke="#333"/>
    <text x="550" y="122">Ordered Event Stream</text>

    <rect x="380" y="190" width="340" height="80" rx="12" fill="#f2f2f2" stroke="#333"/>
    <text x="550" y="225">Replay Coordinator</text>
    <text x="550" y="252" font-size="14">processing order + value date</text>

    <rect x="80" y="330" width="280" height="100" rx="12" fill="#f2f2f2" stroke="#333"/>
    <text x="220" y="370">Append-only Ledger</text>
    <text x="220" y="400" font-size="14">credits / debits / fees / reversals</text>

    <rect x="410" y="330" width="280" height="100" rx="12" fill="#f2f2f2" stroke="#333"/>
    <text x="550" y="370">Authorization State</text>
    <text x="550" y="400" font-size="14">holds + approval / settlement</text>

    <rect x="740" y="330" width="280" height="100" rx="12" fill="#f2f2f2" stroke="#333"/>
    <text x="880" y="370">Errors</text>
    <text x="880" y="400" font-size="14">rejected events, no money posted</text>

    <rect x="220" y="500" width="660" height="85" rx="12" fill="#f2f2f2" stroke="#333"/>
    <text x="550" y="535">Daily Report + Interest Capitalization</text>
    <text x="550" y="562" font-size="14">closing balances, fees, auth states, daily accruals, Day-6 credit</text>
  </g>
  <g stroke="#333" stroke-width="3" fill="none">
    <path d="M550 150 L550 190"/>
    <path d="M550 270 L220 330"/>
    <path d="M550 270 L550 330"/>
    <path d="M550 270 L880 330"/>
    <path d="M220 430 L330 500"/>
    <path d="M550 430 L550 500"/>
    <path d="M880 430 L770 500"/>
  </g>
  <g font-family="Arial" font-size="13" fill="#333">
    <text x="565" y="175">replay</text>
    <text x="350" y="315">money</text>
    <text x="560" y="315">holds</text>
    <text x="760" y="315">validation</text>
  </g>
</svg>
